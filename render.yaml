services:
  - type: web
    name: rbm-api
    runtime: node
    plan: free
    region: ohio
    branch: main
    autoDeploy: true
    buildCommand: npm ci --workspace @rbm/api --workspace @rbm/shared --include=dev --no-audit --no-fund && npm run build
    startCommand: npm run start --workspace @rbm/api
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.12.0
      - key: TRUST_PROXY
        value: "true"
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: ACCESS_TOKEN_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_PEPPER
        generateValue: true
      # Set this to your Expo web origin if you deploy the web build later.
      - key: CORS_ORIGINS
        sync: false
